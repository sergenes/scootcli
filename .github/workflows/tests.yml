name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (the package has no dependencies; pytest is the only test-time extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Test
        run: python -m pytest -q
      - name: Guard the zero-dependency rule
        if: matrix.python != '3.9'  # sys.stdlib_module_names exists from Python 3.10
        run: |
          # Fail if any module under src/ imports something outside the standard library.
          python - <<'PY'
          import ast, pathlib, sys
          stdlib = set(sys.stdlib_module_names)
          bad = []
          for path in pathlib.Path("src/scootcli").rglob("*.py"):
              tree = ast.parse(path.read_text(), str(path))
              for node in ast.walk(tree):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      names = [node.module]
                  for name in names:
                      top = name.split(".")[0]
                      if top not in stdlib and top != "scootcli":
                          bad.append(f"{path}: {name}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("stdlib only: ok")
          PY

  build:
    name: build wheel, sdist, zipapp
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: ./scripts/build.sh
      - run: python -m twine check dist/scootcli-*
      - name: Smoke-run the zipapp
        run: |
          python dist/scoot.pyz --version
          # A handled error must exit non-zero from the archive, exactly as from the module.
          if python dist/scoot.pyz --provider nope "hi" >/dev/null 2>&1; then
            echo "expected a non-zero exit for an unknown provider"; exit 1
          fi
          # The archive holds the package only: no caches, metadata, or Finder files.
          if python -m zipfile -l dist/scoot.pyz | grep -E "__pycache__|\.pyc|\.DS_Store|egg-info"; then
            echo "build debris in the archive"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install-script:
    name: install.sh against the latest release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer into a temp dir and check the result
        run: |
          set -euo pipefail
          DIR="$(mktemp -d)"
          SCOOT_INSTALL_DIR="$DIR" bash install.sh
          "$DIR/scoot" --version
          "$DIR/scoot" --help | head -3
